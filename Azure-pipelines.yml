- stage: Summary
  displayName: 'Migration Summary'
  dependsOn: MigrateDB5
  condition: succeeded()
  jobs:
  - job: FinalReport
    displayName: 'Generate Migration Report'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Show All Job Status'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          
          echo "========================================="
          echo "     MIGRATION COMPLETION SUMMARY"
          echo "========================================="
          kubectl get jobs -n $(namespace)
          echo ""
          echo "✅ ALL 5 DATABASES MIGRATED SUCCESSFULLY!"
