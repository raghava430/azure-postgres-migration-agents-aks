          kubectl apply -f kubernetes/jobs/migration-job-db2.yaml
          kubectl wait --for=condition=complete --timeout=180s job/migration-job-db2 -n $(namespace)

    - task: AzureCLI@2
      displayName: 'Show DB2 Migration Logs'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
