# Azure Database Migration Pipeline
# Sequential deployment with 1-minute gaps and rate limit protection

trigger: none  # Manual trigger only

variables:
  acrName: 'raghavamigrationacr'
  imageName: 'azuredb-migration'
  imageTag: 'v8'
  aksCluster: 'raghava-migration-aks'
  resourceGroup: 'rg-raghav430reddy-2688'
  namespace: 'db-migration'

stages:
# ==============================================================
# STAGE 0: PREREQUISITES
# ==============================================================
- stage: Prerequisites
  displayName: 'Validate Prerequisites'
  jobs:
  - job: Validate
    displayName: 'Check AKS and Docker Image'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Connect to AKS'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Getting AKS credentials..."
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          
          echo "Testing kubectl connection..."
          kubectl get nodes
          
          echo "Checking namespace..."
          kubectl get namespace $(namespace) || kubectl create namespace $(namespace)

    - task: AzureCLI@2
      displayName: 'Check Docker Image in ACR'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking if image exists in ACR..."
          if az acr repository show --name $(acrName) --image $(imageName):$(imageTag) >/dev/null 2>&1; then
            echo "✅ Image $(imageName):$(imageTag) exists in ACR"
            echo "##vso[task.setvariable variable=imageExists;isOutput=true]true"
          else
            echo "⚠️  Image $(imageName):$(imageTag) NOT found in ACR"
            echo "##vso[task.setvariable variable=imageExists;isOutput=true]false"
          fi
      name: imageCheck

    - task: AzureCLI@2
      displayName: 'Build Docker Image (if needed)'
      condition: eq(variables['imageCheck.imageExists'], 'false')
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Building Docker image..."
          
          # Login to ACR
          az acr login --name $(acrName)
          
          # Build image
          docker build -t $(acrName).azurecr.io/$(imageName):$(imageTag) .
          
          # Push to ACR
          docker push $(acrName).azurecr.io/$(imageName):$(imageTag)
          
          echo "✅ Image built and pushed successfully"

# ==============================================================
# STAGE 1: APPLY CONFIGMAPS & SECRETS
# ==============================================================
- stage: Setup
  displayName: 'Setup ConfigMaps and Secrets'
  dependsOn: Prerequisites
  jobs:
  - job: ApplyConfigs
    displayName: 'Apply Kubernetes Configs'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Apply ConfigMaps and Secrets'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          
          echo "Applying common config..."
          kubectl apply -f kubernetes/configs/configmap-common.yaml
          
          echo "Applying database configs..."
          kubectl apply -f kubernetes/configs/configmap-db1.yaml
          kubectl apply -f kubernetes/configs/configmap-db2.yaml
          kubectl apply -f kubernetes/configs/configmap-db3.yaml
          kubectl apply -f kubernetes/configs/configmap-db4.yaml
          kubectl apply -f kubernetes/configs/configmap-db5.yaml
          
          echo "Applying secrets..."
          kubectl apply -f kubernetes/configs/secret.yaml
          
          echo "✅ All configs applied"

# ==============================================================
# STAGE 2: MIGRATE DB1
# ==============================================================
- stage: MigrateDB1
  displayName: 'Migrate Database 1'
  dependsOn: Setup
  jobs:
  - job: DeployDB1
    displayName: 'Deploy DB1 Migration Job'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Delete Previous Job (if exists)'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          kubectl delete job migration-job-db1 -n $(namespace) --ignore-not-found=true

    - task: AzureCLI@2
      displayName: 'Deploy DB1 Job'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          kubectl apply -f kubernetes/jobs/migration-job-db1.yaml
          
          echo "Waiting for job to complete..."
          kubectl wait --for=condition=complete --timeout=180s job/migration-job-db1 -n $(namespace)
          
          echo "Job completed successfully!"

    - task: AzureCLI@2
      displayName: 'Show DB1 Migration Logs'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          echo "=== DB1 MIGRATION LOGS ==="
          kubectl logs -n $(namespace) -l database=db1 --tail=100

    - task: Bash@3
      displayName: 'Wait 60 seconds (Rate Limit Protection)'
      inputs:
        targetType: 'inline'
        script: |
          echo "Waiting 60 seconds before next migration..."
          sleep 60

# ==============================================================
# STAGE 3: MIGRATE DB2
# ==============================================================
- stage: MigrateDB2
  displayName: 'Migrate Database 2'
  dependsOn: MigrateDB1
  condition: succeeded()
  jobs:
  - job: DeployDB2
    displayName: 'Deploy DB2 Migration Job'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Delete Previous Job (if exists)'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          kubectl delete job migration-job-db2 -n $(namespace) --ignore-not-found=true

    - task: AzureCLI@2
      displayName: 'Deploy DB2 Job'
      inputs:
        azureSubscription: 'AzureConnection'
        scriptType: 'bash'
